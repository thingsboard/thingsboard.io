# pnpm 11 no longer reads the `pnpm` field from package.json — settings live here.
# See https://pnpm.io/settings

peerDependencyRules:
  # Suppress warnings about these peer dependencies which we don't need.
  ignoreMissing:
    - '@types/react'
    - 'react'
    - 'react-dom'
    - 'vite'

# Wait 3 days before permitting newly published packages to be installed. This helps protect
# against compromised packages that with any luck will be detected and removed within 3 days.
minimumReleaseAge: 4320

# We don't need these build scripts, so explicitly disallow them as a minor security measure.
# pnpm 11 renamed this from `onlyBuiltDependencies` (a list) to `allowBuilds` (a per-package
# boolean) and now fails the install outright while any package awaits a decision, where pnpm 10
# only warned. `false` reproduces the behaviour the 4504-page build was verified against: under
# pnpm 10 these scripts were skipped and image processing worked regardless, because sharp ships
# prebuilt binaries.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  sharp: false

# Run package scripts with an emulated bash environment for better cross-platform support.
# Moved here from .npmrc, where npm warned about it as an unknown config key.
shellEmulator: true
