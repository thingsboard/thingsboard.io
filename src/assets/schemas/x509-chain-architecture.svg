<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" font-family="Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 650"><title>X.509 certificate chain provisioning: how a device gets and uses its certificate</title><defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c1c3c8" fill-opacity=".5"/></pattern></defs><path fill="#fff" d="M0 0h720v650H0z"/><path fill="url(#dots)" d="M0 0h720v650H0z"/><path stroke="#555962" d="M100 63v577M400 63v357"/><path stroke="#3d50f5" d="M635 63v577"/><rect width="160" height="48" x="20.5" y="14.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="100" y="44" fill="#17181c" font-size="15" font-weight="600" text-anchor="middle">Device</text><rect width="160" height="48" x="320.5" y="14.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="400" y="44" fill="#17181c" font-size="15" font-weight="600" text-anchor="middle">Your PKI</text><rect width="150" height="48" x="560.5" y="14.5" fill="#cfd4fc" stroke="#3d50f5" rx="9.5"/><text x="635" y="44" fill="#17181c" font-size="15" font-weight="600" text-anchor="middle">ThingsBoard</text><text x="517" y="95" fill="#17181c" font-size="13" font-weight="500" text-anchor="middle">0. Intermediate CA certificate</text><path stroke="#3d50f5" stroke-width="1.2" d="M400 105h225"/><path fill="#3d50f5" d="m625 100 10 5-10 5z"/><text x="517" y="124" fill="#555962" font-size="12" text-anchor="middle">registered on the device profile, once</text><rect width="14" height="36" x="93" y="150" fill="#edeef3" stroke="#555962" rx="4"/><text x="117" y="164" fill="#17181c" font-size="13" font-weight="500">1. Generate a key pair</text><text x="117" y="182" fill="#555962" font-size="12">the private key never leaves the device</text><text x="250" y="235" fill="#17181c" font-size="13" font-weight="500" text-anchor="middle">2. Certificate signing request (CSR)</text><path stroke="#555962" stroke-width="1.2" d="M100 245h290"/><path fill="#555962" d="m390 240 10 5-10 5z"/><text x="250" y="264" fill="#555962" font-size="12" text-anchor="middle">public key + CN, signed with the private key;</text><text x="250" y="281" fill="#555962" font-size="12" text-anchor="middle">authenticated with the bootstrap credential</text><text x="250" y="315" fill="#17181c" font-size="13" font-weight="500" text-anchor="middle">3. Device certificate</text><path stroke="#555962" stroke-width="1.2" d="M110 325h290"/><path fill="#555962" d="m110 320-10 5 10 5z"/><text x="250" y="344" fill="#555962" font-size="12" text-anchor="middle">public key + CN, signed by the intermediate CA</text><text x="250" y="385" fill="#17181c" font-size="13" font-weight="500" text-anchor="middle">4. Intermediate CA certificate</text><path stroke="#555962" stroke-width="1.2" d="M110 395h290"/><path fill="#555962" d="m110 390-10 5 10 5z"/><text x="250" y="414" fill="#555962" font-size="12" text-anchor="middle">for example, EST /cacerts</text><rect width="300" height="72" x="20.5" y="440.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="36" y="463" fill="#17181c" font-size="12" font-weight="600">The device now holds:</text><text x="36" y="482" fill="#555962" font-size="12">private key (generated in step 1),</text><text x="36" y="499" fill="#555962" font-size="12">device certificate, intermediate CA certificate</text><text x="370" y="535" fill="#17181c" font-size="13" font-weight="500" text-anchor="middle">5. MQTT over TLS, port 8883</text><path stroke="#3d50f5" stroke-width="1.2" d="M100 545h525"/><path fill="#3d50f5" d="m625 540 10 5-10 5z"/><text x="370" y="564" fill="#555962" font-size="12" text-anchor="middle">presents the device certificate + intermediate CA certificate;</text><text x="370" y="581" fill="#555962" font-size="12" text-anchor="middle">the TLS handshake proves the device holds the private key</text><rect width="14" height="36" x="628" y="597" fill="#cfd4fc" stroke="#3d50f5" rx="4"/><text x="618" y="611" fill="#17181c" font-size="13" font-weight="500" text-anchor="end">6. Verifies the chain against the profile CA,</text><text x="618" y="629" fill="#0f1c8a" font-size="12" text-anchor="end">extracts the device name from the CN, binds the certificate</text></svg>