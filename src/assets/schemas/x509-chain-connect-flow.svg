<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" font-family="Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 600"><title>What happens when a device connects with a certificate chain</title><defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c1c3c8" fill-opacity=".5"/></pattern></defs><path fill="#fff" d="M0 0h720v600H0z"/><path fill="url(#dots)" d="M0 0h720v600H0z"/><rect width="300" height="40" x="210.5" y="20.5" fill="#cfd4fc" stroke="#3d50f5" rx="9.5"/><text x="360" y="45" fill="#17181c" font-size="14" font-weight="600" text-anchor="middle">Device connects with a certificate chain</text><path stroke="#555962" stroke-width="1.2" d="M360 61v21"/><path fill="#555962" d="m355 82 5 8 5-8z"/><rect width="300" height="50" x="210.5" y="90.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="360" y="111" fill="#17181c" font-size="13" text-anchor="middle">Is the device certificate already</text><text x="360" y="129" fill="#17181c" font-size="13" text-anchor="middle">bound to a device?</text><path stroke="#555962" stroke-width="1.2" d="M511 115h41"/><path fill="#555962" d="m552 110 8 5-8 5z"/><text x="531" y="108" fill="#555962" font-size="12" text-anchor="middle">yes</text><rect width="140" height="40" x="560.5" y="95.5" fill="#defbd0" stroke="#4fdf0c" rx="9.5"/><text x="630" y="120" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Connected</text><path stroke="#555962" stroke-width="1.2" d="M360 141v31"/><path fill="#555962" d="m355 172 5 8 5-8z"/><text x="368" y="160" fill="#555962" font-size="12">no</text><rect width="300" height="50" x="210.5" y="180.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="360" y="201" fill="#17181c" font-size="13" text-anchor="middle">Does the chain contain a CA</text><text x="360" y="219" fill="#17181c" font-size="13" text-anchor="middle">registered on a device profile?</text><path stroke="#555962" stroke-width="1.2" d="M511 205h41"/><path fill="#555962" d="m552 200 8 5-8 5z"/><text x="531" y="198" fill="#555962" font-size="12" text-anchor="middle">no</text><rect width="140" height="40" x="560.5" y="185.5" fill="#f9c3d6" stroke="#f53d7d" rx="9.5"/><text x="630" y="210" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Rejected</text><path stroke="#555962" stroke-width="1.2" d="M360 231v31"/><path fill="#555962" d="m355 262 5 8 5-8z"/><text x="368" y="250" fill="#555962" font-size="12">yes</text><rect width="300" height="40" x="210.5" y="270.5" fill="#cfd4fc" stroke="#3d50f5" rx="9.5"/><text x="360" y="295" fill="#0f1c8a" font-size="13" text-anchor="middle">Extract the device name from the CN (regex)</text><path stroke="#555962" stroke-width="1.2" d="M360 311v31"/><path fill="#555962" d="m355 342 5 8 5-8z"/><rect width="300" height="50" x="210.5" y="350.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="360" y="371" fill="#17181c" font-size="13" text-anchor="middle">Does a device with this name</text><text x="360" y="389" fill="#17181c" font-size="13" text-anchor="middle">exist in the profile?</text><path fill="none" stroke="#555962" stroke-width="1.2" d="M210 375h-75v47"/><path fill="#555962" d="m130 422 5 8 5-8z"/><text x="172" y="368" fill="#555962" font-size="12" text-anchor="middle">yes</text><path fill="none" stroke="#555962" stroke-width="1.2" d="M511 375h74v47"/><path fill="#555962" d="m580 422 5 8 5-8z"/><text x="548" y="368" fill="#555962" font-size="12" text-anchor="middle">no</text><rect width="250" height="50" x="10.5" y="430.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="135" y="451" fill="#17181c" font-size="13" text-anchor="middle">Are the device&apos;s credentials</text><text x="135" y="469" fill="#17181c" font-size="13" text-anchor="middle">of type X.509?</text><rect width="250" height="50" x="460.5" y="430.5" fill="#edeef3" stroke="#555962" rx="9.5"/><text x="585" y="451" fill="#17181c" font-size="13" text-anchor="middle">Is &quot;Create new devices&quot;</text><text x="585" y="469" fill="#17181c" font-size="13" text-anchor="middle">enabled on the profile?</text><path stroke="#555962" stroke-width="1.2" d="M70 481v41"/><path fill="#555962" d="m65 522 5 8 5-8z"/><text x="78" y="508" fill="#555962" font-size="12">yes</text><rect width="130" height="56" x="10.5" y="530.5" fill="#defbd0" stroke="#4fdf0c" rx="9.5"/><text x="75" y="554" fill="#17181c" font-size="13" text-anchor="middle">Store certificate</text><text x="75" y="574" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Connected</text><path stroke="#555962" stroke-width="1.2" d="M210 481v41"/><path fill="#555962" d="m205 522 5 8 5-8z"/><text x="218" y="508" fill="#555962" font-size="12">no</text><rect width="120" height="56" x="150.5" y="530.5" fill="#f9c3d6" stroke="#f53d7d" rx="9.5"/><text x="210" y="554" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Rejected</text><text x="210" y="574" fill="#17181c" font-size="12" text-anchor="middle">e.g. access token</text><path stroke="#555962" stroke-width="1.2" d="M525 481v41"/><path fill="#555962" d="m520 522 5 8 5-8z"/><text x="533" y="508" fill="#555962" font-size="12">yes</text><rect width="130" height="56" x="460.5" y="530.5" fill="#defbd0" stroke="#4fdf0c" rx="9.5"/><text x="525" y="554" fill="#17181c" font-size="13" text-anchor="middle">Create device</text><text x="525" y="574" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Connected</text><path stroke="#555962" stroke-width="1.2" d="M655 481v41"/><path fill="#555962" d="m650 522 5 8 5-8z"/><text x="663" y="508" fill="#555962" font-size="12">no</text><rect width="110" height="56" x="600.5" y="530.5" fill="#f9c3d6" stroke="#f53d7d" rx="9.5"/><text x="655" y="563" fill="#17181c" font-size="13" font-weight="600" text-anchor="middle">Rejected</text></svg>