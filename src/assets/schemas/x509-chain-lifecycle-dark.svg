<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" font-family="Roboto, Helvetica, Arial, sans-serif" viewBox="0 0 720 260"><title>Device certificate lifecycle with X.509 certificate chain provisioning</title><defs><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#353841" fill-opacity=".5"/></pattern></defs><path fill="#17181c" d="M0 0h720v260H0z"/><path fill="url(#dots)" d="M0 0h720v260H0z"/><text x="70" y="32" fill="#888c96" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">FACTORY</text><text x="215" y="32" fill="#888c96" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">FIRST BOOT</text><text x="360" y="32" fill="#888c96" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">OPERATION</text><text x="505" y="32" fill="#888c96" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">RENEWAL</text><text x="650" y="32" fill="#ee5389" font-size="12" font-weight="600" letter-spacing=".5" text-anchor="middle">COMPROMISE</text><rect width="120" height="150" x="10.5" y="45.5" fill="#23262f" stroke="#888c96" rx="9.5"/><text x="70" y="80" fill="#fff" font-size="13" text-anchor="middle">CA certificate</text><text x="70" y="100" fill="#fff" font-size="13" text-anchor="middle">and bootstrap</text><text x="70" y="120" fill="#fff" font-size="13" text-anchor="middle">credential</text><rect width="120" height="150" x="155.5" y="45.5" fill="#23262f" stroke="#888c96" rx="9.5"/><text x="215" y="80" fill="#fff" font-size="13" text-anchor="middle">Generate key</text><text x="215" y="100" fill="#fff" font-size="13" text-anchor="middle">and CSR,</text><text x="215" y="120" fill="#fff" font-size="13" text-anchor="middle">enroll with</text><text x="215" y="140" fill="#fff" font-size="13" text-anchor="middle">your PKI</text><text x="215" y="170" fill="#888c96" font-size="12" text-anchor="middle">unique certificate</text><rect width="120" height="150" x="300.5" y="45.5" fill="#17264f" stroke="#3369ff" rx="9.5"/><text x="360" y="80" fill="#fff" font-size="13" text-anchor="middle">Connect with</text><text x="360" y="100" fill="#fff" font-size="13" text-anchor="middle">the chain;</text><text x="360" y="120" fill="#fff" font-size="13" text-anchor="middle">ThingsBoard</text><text x="360" y="140" fill="#fff" font-size="13" text-anchor="middle">binds the</text><text x="360" y="160" fill="#fff" font-size="13" text-anchor="middle">certificate</text><rect width="120" height="150" x="445.5" y="45.5" fill="#17264f" stroke="#3369ff" rx="9.5"/><text x="505" y="80" fill="#fff" font-size="13" text-anchor="middle">Re-enroll</text><text x="505" y="100" fill="#fff" font-size="13" text-anchor="middle">(same CN),</text><text x="505" y="120" fill="#fff" font-size="13" text-anchor="middle">reconnect;</text><text x="505" y="140" fill="#fff" font-size="13" text-anchor="middle">re-bound</text><text x="505" y="160" fill="#fff" font-size="13" text-anchor="middle">automatically</text><rect width="120" height="150" x="590.5" y="45.5" fill="#4e2232" stroke="#ee5389" stroke-dasharray="5 4" rx="9.5"/><text x="650" y="80" fill="#fff" font-size="13" text-anchor="middle">New CN,</text><text x="650" y="100" fill="#fff" font-size="13" text-anchor="middle">rename device,</text><text x="650" y="120" fill="#fff" font-size="13" text-anchor="middle">reset</text><text x="650" y="140" fill="#fff" font-size="13" text-anchor="middle">credentials,</text><text x="650" y="160" fill="#fff" font-size="13" text-anchor="middle">revoke in PKI</text><path stroke="#888c96" stroke-width="1.2" d="M131 120h16"/><path fill="#888c96" d="m147 115 8 5-8 5z"/><path stroke="#888c96" stroke-width="1.2" d="M276 120h16"/><path fill="#888c96" d="m292 115 8 5-8 5z"/><path stroke="#3369ff" stroke-width="1.2" d="M421 120h16"/><path fill="#3369ff" d="m437 115 8 5-8 5z"/><text x="70" y="222" fill="#888c96" font-size="12" text-anchor="middle">Your PKI</text><text x="215" y="222" fill="#888c96" font-size="12" text-anchor="middle">Device + PKI</text><text x="360" y="222" fill="#bdc3ff" font-size="12" text-anchor="middle">ThingsBoard</text><text x="505" y="222" fill="#bdc3ff" font-size="12" text-anchor="middle">Device + PKI + ThingsBoard</text><text x="650" y="222" fill="#ee5389" font-size="12" text-anchor="middle">Manual procedure</text></svg>