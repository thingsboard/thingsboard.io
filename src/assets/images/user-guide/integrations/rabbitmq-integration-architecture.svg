      <text x="571" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">payload</text>

      <!-- ============ BLOCK 4: Data Converters ============ -->
      <rect x="606" y="20" width="130" height="130" rx="10" fill="#fff" stroke="#00695c" stroke-width="1.5"/>
      <text x="671" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#17181c" font-weight="600" dominant-baseline="hanging">Data Converters</text>
      <g transform="matrix(0.217828,0,0,0.213574,616.2844,53.1842)" fill="#00695c">
        <path d="m 373.23,68.177 -61.8,-41.6 c -3.4,-2.3 -7.9,0.1 -7.9,4.2 v 22.5 h -153.6 c -10.6,0 -19.1,8.6 -19.1,19.1 v 106.5 c 0,2.3 2.6,3.7 4.5,2.4 l 30,-20.2 c 2.3,-1.5 3.7,-4.1 3.7,-6.9 v -62.7 h 134.4 v 22.5 c 0,4.1 4.5,6.5 7.9,4.2 l 61.8,-41.6 c 3.1,-2 3.1,-6.4 0.1,-8.4 z"/>
        <path d="m 354.13,117.98 -30,20.2 c -2.3,1.5 -3.7,4.1 -3.7,6.9 v 62.6 h -134.5 v -22.5 c 0,-4.1 -4.5,-6.5 -7.9,-4.2 l -61.8,41.6 c -3,2 -3,6.4 0,8.4 l 61.8,41.6 c 3.4,2.3 7.9,-0.1 7.9,-4.2 v -22.5 h 153.5 c 10.6,0.1 19.2,-8.5 19.2,-19.1 v -106.4 c 0,-2.3 -2.6,-3.7 -4.5,-2.4 z"/>
      </g>
      <rect x="615" y="122" width="48" height="15" rx="7.5" fill="#e6f4f1"/>
      <text x="639" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#00695c" font-weight="700" dominant-baseline="central">Uplink</text>
      <rect x="670" y="122" width="58" height="15" rx="7.5" fill="#fde8ef"/>
      <text x="699" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#8a0f3a" font-weight="700" dominant-baseline="central">Downlink</text>

      <!-- GAP 4 UPLINK: telemetry / attributes -->
      <line x1="736" y1="78" x2="798" y2="78" stroke="#1565c0" stroke-width="1.5"/>
