<svg xmlns="http://www.w3.org/2000/svg" width="1443" height="432" viewBox="0 0 962 288">
  <defs>
    <pattern id="dots" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="1" fill="#dde0e4"/>
    </pattern>
    <clipPath id="clip0">
      <path fill="#fff" d="M0 0h962v288H0z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip0)">
    <path fill="#fff" d="M0 0h962v288H0z"/>
    <rect width="962" height="288" fill="url(#dots)"/>
    <g transform="translate(0,33)">

      <!-- ThingsBoard Deployment outer box (covers B3, B4, B5) -->
      <rect x="390" y="-11" width="562" height="192" rx="12" fill="none" stroke="#00695c" stroke-width="0.75" stroke-dasharray="6,4"/>
      <rect x="410" y="-18" width="178" height="14" fill="#fff"/>
      <text x="501" y="-11" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#00695c" font-weight="600" dominant-baseline="central" textLength="174" lengthAdjust="spacing">ThingsBoard Deployment</text>

      <!-- ============ BLOCK 1: Producer / Consumer (external) ============ -->
      <rect x="6" y="59" width="150" height="52" rx="10" fill="#fff" stroke="#6a1b9a" stroke-width="1.5"/>
      <g transform="translate(13.3,64.3) scale(0.69)" fill="#6a1b9a">
        <rect x="14" y="14" width="32" height="32" rx="2" fill="#6a1b9a"/>
        <rect x="19" y="19" width="22" height="22" rx="1" fill="#fff"/>
        <rect x="20" y="8" width="4" height="7" rx="1"/>
        <rect x="28" y="8" width="4" height="7" rx="1"/>
        <rect x="36" y="8" width="4" height="7" rx="1"/>
        <rect x="20" y="45" width="4" height="7" rx="1"/>
        <rect x="28" y="45" width="4" height="7" rx="1"/>
        <rect x="36" y="45" width="4" height="7" rx="1"/>
        <rect x="8" y="20" width="7" height="4" rx="1"/>
        <rect x="8" y="28" width="7" height="4" rx="1"/>
        <rect x="8" y="36" width="7" height="4" rx="1"/>
        <rect x="45" y="20" width="7" height="4" rx="1"/>
        <rect x="45" y="28" width="7" height="4" rx="1"/>
        <rect x="45" y="36" width="7" height="4" rx="1"/>
      </g>
      <text x="99" y="79" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#17181c" font-weight="600" dominant-baseline="middle">Producer /</text>
      <text x="99" y="91" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#17181c" font-weight="600" dominant-baseline="middle">Consumer</text>

      <!-- GAP 1 UPLINK: publish -->
      <line x1="156" y1="78" x2="218" y2="78" stroke="#1565c0" stroke-width="1.5"/>
      <polygon points="218,74 226,78 218,82" fill="#1565c0"/>
      <text x="191" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">publish</text>
      <!-- GAP 1 DOWNLINK: consume -->
      <line x1="226" y1="92" x2="164" y2="92" stroke="#f53d7d" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="164,88 156,92 164,96" fill="#f53d7d"/>
      <text x="191" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">consume</text>

      <!-- ============ BLOCK 2: RabbitMQ (exchange + queue) ============ -->
      <rect x="226" y="30" width="110" height="110" rx="10" fill="#fff" stroke="#00695c" stroke-width="1.5"/>
