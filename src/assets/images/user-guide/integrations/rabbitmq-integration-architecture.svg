      <!-- GAP 3 DOWNLINK: encoded payload -->
      <line x1="606" y1="92" x2="544" y2="92" stroke="#f53d7d" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="544,88 536,92 544,96" fill="#f53d7d"/>
