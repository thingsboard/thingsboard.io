      <g fill="#ff6600">
        <rect x="246" y="38" width="3.2" height="10" rx="1.6" transform="rotate(-13 247.6 43)"/>
        <rect x="252" y="38" width="3.2" height="10" rx="1.6" transform="rotate(13 253.6 43)"/>
        <circle cx="250" cy="49" r="4.6"/>
      </g>
      <text x="288" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#17181c" font-weight="700" dominant-baseline="middle">RabbitMQ</text>
