      <text x="771" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">attributes</text>
      <!-- GAP 4 DOWNLINK: Integration Downlink -->
      <line x1="806" y1="92" x2="744" y2="92" stroke="#f53d7d" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="744,88 736,92 744,96" fill="#f53d7d"/>
      <text x="771" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">RPC command /</text>
      <text x="771" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">attribute update</text>

      <!-- ============ BLOCK 5: ThingsBoard Core Services ============ -->
      <rect x="806" y="5" width="130" height="160" rx="10" fill="#fff" stroke="#00695c" stroke-width="1.5"/>
      <text x="871" y="18" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#17181c" font-weight="600" dominant-baseline="hanging">ThingsBoard</text>
      <text x="871" y="32" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#17181c" font-weight="600" dominant-baseline="hanging">Core Services</text>
      <g transform="translate(117,5)">
        <!-- Storage -->
        <rect x="701" y="50" width="106" height="26" rx="5" fill="#f0f1f3" stroke="#c1c3c8" stroke-width=".8"/>
        <g fill="#00695c" transform="translate(45,-6.5)">
          <ellipse cx="669" cy="65" rx="7" ry="2.5" fill="#00695c"/>
          <rect x="662" y="65" width="14" height="9" fill="#00695c"/>
          <ellipse cx="669" cy="74" rx="7" ry="2.5" fill="#00695c"/>
          <ellipse cx="669" cy="65" rx="7" ry="2.5" fill="#e6f4f1" opacity=".5"/>
        </g>
        <text x="744" y="63" text-anchor="start" font-family="system-ui,sans-serif" font-size="8.5" fill="#37474f" font-weight="600" dominant-baseline="central">Storage</text>
        <!-- Dashboards -->
        <rect x="701" y="82" width="106" height="26" rx="5" fill="#f0f1f3" stroke="#c1c3c8" stroke-width=".8"/>
        <g fill="#00695c" transform="translate(47.5,-5.5)">
          <rect x="661" y="99" width="2.5" height="7" rx=".5"/>
          <rect x="665" y="95" width="2.5" height="11" rx=".5"/>
          <rect x="669" y="97" width="2.5" height="9" rx=".5"/>
          <path d="M674,104 a6,6 0 0,1 12,0" fill="none" stroke="#00695c" stroke-width="1.3"/>
          <line x1="680" y1="104" x2="677" y2="99" stroke="#00695c" stroke-width="1" stroke-linecap="round"/>
          <circle cx="680" cy="104" r="1" fill="#00695c"/>
        </g>
        <text x="744" y="95" text-anchor="start" font-family="system-ui,sans-serif" font-size="8.5" fill="#37474f" font-weight="600" dominant-baseline="central">Dashboards</text>
        <!-- more services indicator (…) -->
        <circle cx="749" cy="115" r="1.4" fill="#9aa0a6"/>
        <circle cx="754" cy="115" r="1.4" fill="#9aa0a6"/>
        <circle cx="759" cy="115" r="1.4" fill="#9aa0a6"/>
        <!-- Rule Engine -->
        <rect x="701" y="122" width="106" height="26" rx="5" fill="#f0f1f3" stroke="#c1c3c8" stroke-width=".8"/>
        <g fill="#00695c" transform="translate(49,0)">
          <circle cx="665" cy="135" r="4" fill="none" stroke="#00695c" stroke-width="1.3"/>
          <circle cx="665" cy="135" r="1.5" fill="#00695c"/>
          <rect x="664" y="129.5" width="2" height="2" rx=".4"/>
          <rect x="664" y="138.5" width="2" height="2" rx=".4"/>
          <rect x="659" y="134" width="2" height="2" rx=".4"/>
          <rect x="669" y="134" width="2" height="2" rx=".4"/>
          <circle cx="672" cy="129" r="2.5" fill="none" stroke="#00695c" stroke-width="1"/>
          <circle cx="672" cy="129" r="1" fill="#00695c"/>
          <line x1="678" y1="128" x2="678" y2="142" stroke="#00695c" stroke-width="1.2"/>
          <polygon points="683,128 681,134 683.5,134 681,141 687,133 684.5,133 687,128" fill="#00695c"/>
        </g>
        <text x="744" y="135" text-anchor="start" font-family="system-ui,sans-serif" font-size="8.5" fill="#37474f" font-weight="600" dominant-baseline="central">Rule Engine</text>
      </g>

      <!-- LEGEND -->
      <line x1="26" y1="200" x2="64" y2="200" stroke="#1565c0" stroke-width="1.5"/>
      <polygon points="56,196 64,200 56,204" fill="#1565c0"/>
      <text x="78" y="204" font-family="system-ui,sans-serif" font-size="11" fill="#555962">Uplink — producer message → RabbitMQ → ThingsBoard</text>
      <line x1="26" y1="222" x2="64" y2="222" stroke="#f53d7d" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="34,218 26,222 34,226" fill="#f53d7d"/>
      <text x="78" y="226" font-family="system-ui,sans-serif" font-size="11" fill="#555962">Downlink — Rule Engine → RabbitMQ → external consumer</text>

    </g>
  </g>
</svg>
