      <text x="281" y="72" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#37474f" font-weight="600" dominant-baseline="central">Exchange</text>
      <!-- routing arrows: uplink (blue, down) left + downlink (red, up) right, label between -->
      <line x1="253" y1="84" x2="253" y2="101" stroke="#1565c0" stroke-width="1.2"/>
      <polygon points="249,99 253,105 257,99" fill="#1565c0"/>
      <text x="281" y="92" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="#888d99">routing key /</text>
      <text x="281" y="99" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6.5" fill="#888d99">binding</text>
      <line x1="309" y1="104" x2="309" y2="87" stroke="#f53d7d" stroke-width="1.2" stroke-dasharray="3,2"/>
      <polygon points="305,89 309,83 313,89" fill="#f53d7d"/>
      <!-- Queue sub-block -->
      <rect x="240" y="106" width="82" height="20" rx="4" fill="#f0f1f3" stroke="#c1c3c8" stroke-width=".8"/>
      <text x="281" y="116" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#37474f" font-weight="600" dominant-baseline="central">Queue</text>

      <!-- GAP 2 UPLINK: consume from queue -->
      <line x1="336" y1="78" x2="398" y2="78" stroke="#1565c0" stroke-width="1.5"/>
      <polygon points="398,74 406,78 398,82" fill="#1565c0"/>
      <text x="371" y="61" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">consume</text>
      <text x="371" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">from queue</text>
      <!-- GAP 2 DOWNLINK: publish to exchange -->
      <line x1="406" y1="92" x2="344" y2="92" stroke="#f53d7d" stroke-width="1.5" stroke-dasharray="4,3"/>
      <polygon points="344,88 336,92 344,96" fill="#f53d7d"/>
      <text x="371" y="105" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">publish</text>
      <text x="371" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" fill="#888d99">to exchange</text>

      <!-- ============ BLOCK 3: RabbitMQ Integration ============ -->
      <rect x="406" y="20" width="130" height="130" rx="10" fill="#fff" stroke="#00695c" stroke-width="1.5"/>
      <text x="471" y="33" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#17181c" font-weight="600" dominant-baseline="hanging">RabbitMQ</text>
      <text x="471" y="49" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#17181c" font-weight="600" dominant-baseline="hanging">Integration</text>
      <g transform="matrix(-0.169870,0,0,-0.166552,516.5201,141.5578)" fill="#00695c">
        <path d="m 465.3,145.05 h -43.5 c -17.7,0 -21.8,-14.7 -12.6,-25.3 15.2,-17.2 7.1,-43 -20.2,-44.5 -27.3,1 -35.4,27.3 -20.2,44 9.1,10.1 5.1,25.3 -12.6,25.3 h -42.5 c -12.6,0 -23.3,10.1 -23.3,23.3 v 55.1 h -1 -78.4 v -21.8 c 0,-2 -2.5,-3 -4.6,-1.5 l -51.1,42 c -1.5,1.5 -1.5,4 0,5.6 l 51.1,42 c 2,1.5 4.6,0 4.6,-2 v -21.8 h 78.2 1 v 55.6 c 0,12.6 10.1,23.3 23.3,23.3 H 356 c 17.7,0 21.8,14.7 12.6,24.8 -15.2,17.2 -7.1,43 20.2,44 27.3,-1 35.4,-27.3 20.2,-44 -9.1,-10.1 -5.1,-24.8 12.6,-24.8 h 43 c 13.2,0 23.8,-10.6 23.8,-23.8 v -43.6 c -0.5,-17.2 -15.2,-21.2 -25.3,-12.1 -17.2,15.2 -43.5,7.1 -44.5,-20.2 1,-27.3 27.3,-35.4 44.5,-20.2 10.1,9.1 24.8,5.1 25.3,-12.1 v -44 c 0.1,-12.7 -10,-23.3 -23.1,-23.3 z"/>
        <path d="m 244.7,145.45 h -43.5 c -17.7,0 -21.8,-15.2 -12.6,-25.3 15.2,-17.2 7.1,-43.5 -20.2,-44.5 -27.3,1 -35.4,26.8 -20.2,44 9.1,10.1 5.1,25.3 -12.6,25.3 H 93.1 c -13.2,0 -23.3,10.6 -23.3,23.3 v 43.5 c 0,17.7 -15.2,21.8 -25.3,12.6 -17.2,-15.2 -43.5,-7.1 -44.5,20.2 1,27.3 27.3,35.4 44,20.2 10.1,-9.1 25.3,-5.1 25.3,12.6 v 43 c 0,13.2 10.6,23.3 23.3,23.3 h 42.5 c 17.7,0 21.8,14.7 12.6,24.8 -15.2,16.7 -7.1,43 20.2,44 27.3,-1 35.4,-26.8 20.2,-44 -9.1,-10.1 -5.1,-24.8 12.6,-24.8 h 43 c 13.2,0 23.8,-10.6 23.8,-23.8 v -32.7 h -34.4 c -0.5,13.7 -11.7,24.8 -25.3,24.8 -6.1,0 -11.6,-2 -16.2,-5.6 l -51.1,-42 c -6.1,-5.1 -9.6,-12.1 -9.6,-20.2 0,-8.1 3.5,-15.2 9.6,-20.2 l 51.6,-42 c 4.6,-3.5 10.1,-5.6 16.2,-5.6 13.7,0 24.8,11.1 25.3,24.8 H 268 v -32.4 c 0,-13.2 -10.6,-23.3 -23.3,-23.3 z"/>
      </g>

      <!-- GAP 3 UPLINK: raw message -->
