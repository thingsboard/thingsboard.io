<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" viewBox="0 0 980 330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#c1c3c8" opacity=".5"/></pattern><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#f5bb3d" stroke-width="1.5" opacity=".6"/></pattern></defs><rect width="980" height="330" fill="#fff"/><rect width="980" height="330" fill="url(#d)"/><line x1="800" y1="44" x2="800" y2="262" stroke="#888c96" stroke-width="1.2" stroke-dasharray="4 4"/><text x="800" y="36" font-size="12" font-weight="500" fill="#5b5f6b" text-anchor="middle" font-style="italic">now</text><text x="40" y="62" font-size="13" font-weight="600" fill="#23262f">1. Check the model</text><rect x="40" y="72" width="560" height="44" rx="6" fill="#cfd4fc" stroke="#3d50f5" stroke-width="1.2"/><text x="320.0" y="99" font-size="13" font-weight="600" fill="#0f1c8a" text-anchor="middle">Learns from the first part</text><rect x="600" y="72" width="200" height="44" rx="6" fill="#fceac5" stroke="#f5bb3d" stroke-width="1.2"/><rect x="600" y="72" width="200" height="44" rx="6" fill="url(#h)" stroke="#f5bb3d" stroke-width="1.2"/><text x="700.0" y="99" font-size="13" font-weight="600" fill="#73520d" text-anchor="middle">Held back: predicted</text><text x="814" y="92" font-size="12" font-weight="600" fill="#73520d">Compared with</text><text x="814" y="108" font-size="12" font-weight="600" fill="#73520d">what happened</text><text x="814" y="132" font-size="12" font-weight="500" fill="#5b5f6b">= accuracy score</text><text x="40" y="170" font-size="13" font-weight="600" fill="#23262f">2. Build the final model</text><rect x="40" y="180" width="760" height="44" rx="6" fill="#d6e7e5" stroke="#00695c" stroke-width="1.2"/><text x="420.0" y="207" font-size="13" font-weight="600" fill="#00695c" text-anchor="middle">Learns from all the history, including the held-back part</text><rect x="808" y="180" width="132" height="44" rx="6" fill="none" stroke="#00695c" stroke-width="1.2" stroke-dasharray="5 4"/><text x="874.0" y="207" font-size="13" font-weight="600" fill="#00695c" text-anchor="middle">Forecast</text><polyline points="40,246 800,246" fill="none" stroke="#888c96" stroke-width="1.2"/><text x="40" y="266" font-size="12" font-weight="500" fill="#5b5f6b" font-style="italic">training period</text><text x="40" y="304" font-size="13" font-weight="600" fill="#23262f">3. Keep checking</text><text x="170" y="304" font-size="13" font-weight="500" fill="#5b5f6b">Every later forecast is scored once its time has passed, so the score keeps improving.</text></svg>