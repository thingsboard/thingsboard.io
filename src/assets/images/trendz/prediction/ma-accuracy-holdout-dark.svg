<svg xmlns="http://www.w3.org/2000/svg" width="980" height="330" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" viewBox="0 0 980 330"><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#353841" opacity=".5"/></pattern><pattern id="h" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><path stroke="#eebd53" stroke-width="1.5" d="M0 0v6" opacity=".6"/></pattern></defs><path fill="#17181c" d="M0 0h980v330H0z"/><path fill="url(#d)" d="M0 0h980v330H0z"/><path stroke="#888c96" stroke-dasharray="4 4" stroke-width="1.2" d="M800 44v218"/><text x="800" y="36" fill="#a3a7b1" font-size="12" font-style="italic" font-weight="500" text-anchor="middle">now</text><text x="40" y="62" fill="#edeef3" font-size="13" font-weight="600">1. Check the model</text><rect width="560" height="44" x="40" y="72" fill="#17264f" stroke="#3369ff" stroke-width="1.2" rx="6"/><text x="320" y="99" fill="#edeef3" font-size="13" font-weight="600" text-anchor="middle">Learns from the first part</text><rect width="200" height="44" x="600" y="72" fill="#4e4022" stroke="#eebd53" stroke-width="1.2" rx="6"/><rect width="200" height="44" x="600" y="72" fill="url(#h)" stroke="#eebd53" stroke-width="1.2" rx="6"/><text x="700" y="99" fill="#f9e8c3" font-size="13" font-weight="600" text-anchor="middle">Held back: predicted</text><text x="814" y="92" fill="#f9e8c3" font-size="12" font-weight="600">Compared with</text><text x="814" y="108" fill="#f9e8c3" font-size="12" font-weight="600">what happened</text><text x="814" y="132" fill="#a3a7b1" font-size="12" font-weight="500">= accuracy score</text><text x="40" y="170" fill="#edeef3" font-size="13" font-weight="600">2. Build the final model</text><rect width="760" height="44" x="40" y="180" fill="#1d3739" stroke="#3fd9d1" stroke-width="1.2" rx="6"/><text x="420" y="207" fill="#3fd9d1" font-size="13" font-weight="600" text-anchor="middle">Learns from all the history, including the held-back part</text><rect width="132" height="44" x="808" y="180" fill="none" stroke="#3fd9d1" stroke-dasharray="5 4" stroke-width="1.2" rx="6"/><text x="874" y="207" fill="#3fd9d1" font-size="13" font-weight="600" text-anchor="middle">Forecast</text><path fill="none" stroke="#888c96" stroke-width="1.2" d="M40 246h760"/><text x="40" y="266" fill="#a3a7b1" font-size="12" font-style="italic" font-weight="500">training period</text><text x="40" y="304" fill="#edeef3" font-size="13" font-weight="600">3. Keep checking</text><text x="170" y="304" fill="#a3a7b1" font-size="13" font-weight="500">Every later forecast is scored once its time has passed, so the score keeps improving.</text></svg>