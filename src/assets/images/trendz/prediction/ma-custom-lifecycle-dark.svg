<svg xmlns="http://www.w3.org/2000/svg" width="980" height="250" viewBox="0 0 980 250" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"><defs><pattern id="d" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="7" cy="7" r="1" fill="#353841" opacity="1"/></pattern><pattern id="h" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#eebd53" stroke-width="1.5" opacity=".6"/></pattern></defs><rect width="980" height="250" fill="#17181c"/><rect width="980" height="250" fill="url(#d)"/><text x="30" y="67" font-size="14" font-weight="600" fill="#edeef3" text-anchor="start">Build or retrain</text><rect x="200" y="40" width="112.22055625" height="42" rx="8" fill="#23262f" stroke="#3369ff" stroke-width="1.6"/><text x="256.110278125" y="66" font-size="13" font-weight="600" fill="#edeef3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">init_state()</text><polyline points="312.22055625,61 346.22055625,61" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linejoin="round"/><polyline points="339.2,64.8 346.22055625,61 339.2,57.2" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="346.22055625" y="40" width="109.503975" height="42" rx="8" fill="#23262f" stroke="#3369ff" stroke-width="1.6"/><text x="400.97254375" y="66" font-size="13" font-weight="600" fill="#edeef3" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">train(data)</text><polyline points="455.72453125000004,61 489.72453125000004,61" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linejoin="round"/><polyline points="482.7,64.8 489.72453125000004,61 482.7,57.2" fill="none" stroke="#3369ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="489.72453125000004" y="40" width="185.43144375" height="42" rx="8" fill="#23262f" stroke="#3369ff" stroke-width=