<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" fill="none" viewBox="0 0 880 340"><defs><marker id="chevGrey" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path stroke="#888c96" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1.5 8 5 2 8.5"/></marker><marker id="chevBlue" markerHeight="10" markerUnits="userSpaceOnUse" markerWidth="10" orient="auto" refX="8" refY="5"><path stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2 1.5 8 5 2 8.5"/></marker><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#c1c3c8" opacity=".5"/></pattern></defs><path fill="#fff" d="M0 0h880v340H0z"/><path fill="url(#dots)" d="M0 0h880v340H0z"/><circle cx="150" cy="150" r="70" fill="#edeef3" stroke="#555962" stroke-width="1.5"/><circle cx="150" cy="150" r="10" fill="#555962"/><rect width="10" height="16" x="145" y="86" fill="#3d50f5" rx="2"/><path stroke="#3d50f5" stroke-linecap="round" stroke-width="1.5" marker-end="url(#chevBlue)" d="M121.6 66.7a88 88 0 0 1 83.1 152.2"/><text x="150" y="262" fill="#17181c" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">1800 RPM</text><text x="150" y="284" fill="#5b5f6b" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="12.5" font-weight="500" text-anchor="middle">= 30 turns per second = 30 Hz</text><text x="150" y="304" fill="#0f1c8a" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">That is 1×, the shaft speed</text><text x="330" y="30" fill="#17181c" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" font-weight="600">Peaks on whole orders belong to the shaft.</text><text x="330" y="50" fill="#17181c" f