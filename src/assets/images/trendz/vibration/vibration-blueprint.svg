"><path d="M803 930v-10a10 10 0 0 1 20 0v10l3 4h-26zm7 8a3 3 0 0 0 6 0"/></g><text x="855" y="914" fill="#23262f" font-size="15.5" font-weight="600">Raise alarms</text><text x="855" y="934" fill="#5b5f6b" font-size="12.5" font-weight="500">Every alarm rule</text><text x="855" y="951" fill="#5b5f6b" font-size="12.5" font-weight="500">checked on the sample</text><path fill="none" stroke="#3d50f5" stroke-linejoin="round" stroke-width="1.8" d="M905 448v34"/><path fill="none" stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m900.7 474.1 4.3 7.9 4.3-7.9"/><path fill="none" stroke="#3d50f5" stroke-linejoin="round" stroke-width="1.8" d="M905 578v34"/><path fill="none" stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m900.7 604.1 4.3 7.9 4.3-7.9"/><path fill="none" stroke="#3d50f5" stroke-linejoin="round" stroke-width="1.8" d="M905 708v34"/><path fill="none" stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m900.7 734.1 4.3 7.9 4.3-7.9"/><path fill="none" stroke="#3d50f5" stroke-linejoin="round" stroke-width="1.8" d="M905 838v34"/><path fill="none" stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m900.7 864.1 4.3 7.9 4.3-7.9"/><rect width="272" height="96" x="1074" y="612" fill="#fff" stroke="#3d50f5" stroke-width="1.5" rx="9"/><rect width="56" height="56" x="1090" y="632" fill="#cfd4fc" rx="10"/><g fill="none" stroke="#3d50f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" transform="translate(1090 632)"><ellipse cx="28" cy="15" rx="15" ry="5"/><path d="M13 15v26c0 3 7 5 15 5s15-2 15-5V15"/><path d="M13 28c0 3 7 5 15 5s15-2 15-5"/></g><text x="1160" y="654" fill="#23262f" font-size="15.5" font-weight="600">Trendz database</text><text x="1160" y="674" fill="#5b5f6b" font-size="12.5" font-weight="500">Spectra, metrics,</text><text x="1160" y="691" fill="#5b5f6b" font-size="12.5" font-weight="500">and grades</text