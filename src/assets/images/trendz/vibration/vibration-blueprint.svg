="round" stroke-width="2" d="M493.9 775.7 486 780l7.9 4.3"/><circle cx="595" cy="850" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="595" y="855.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">8</text><rect width="272" height="990" x="1380" y="110" fill="#fff" stroke="#d4d6db" stroke-width="1.2" rx="12"/><text x="1398" y="152" fill="#23262f" font-size="17" font-weight="700">The story</text><circle cx="1412" cy="210" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="215.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="1436" y="208" fill="#23262f" font-size="13.5" font-weight="500">The sensor sends a 3-second</text><text x="1436" y="227" fill="#5b5f6b" font-size="13.5" font-weight="500">signal once a day.</text><circle cx="1412" cy="314" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="319.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="1436" y="312" fill="#23262f" font-size="13.5" font-weight="500">ThingsBoard stores it as</text><text x="1436" y="331" fill="#5b5f6b" font-size="13.5" font-weight="500">device telemetry.</text><circle cx="1412" cy="418" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="423.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">3</text><text x="1436" y="416" fill="#23262f" font-size="13.5" font-weight="500">The scheduled scan starts</text><text x="1436" y="435" fill="#5b5f6b" font-size="13.5" font-weight="500">a scan task in Trendz.</text><circle cx="1412" cy="522" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="527.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">4</text><text x="1436" y="520" fill="#23262f" font-size="13.5" font-weight="500">Trendz reads the newest</text><text x="1436" y="539" fill="#5b5f6b" font-size="13.5" font-weight="500">sample of each device.</text><circle cx="1412" cy="626" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="631.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">5</text><text x="1436" y="624" fill="#23262f" font-size="13.5" font-weight="500">Trendz analyzes it: spectra,</text><text x="1436" y="643" fill="#5b5f6b" font-size="13.5" font-weight="500">metrics, ISO zone, faults.</text><circle cx="1412" cy="730" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="735.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">6</text><text x="1436" y="728" fill="#23262f" font-size="13.5" font-weight="500">Trendz saves the results</text><text x="1436" y="747" fill="#5b5f6b" font-size="13.5" font-weight="500">in its own database.</text><circle cx="1412" cy="834" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="839.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">7</text><text x="1436" y="832" fill="#23262f" font-size="13.5" font-weight="500">Trendz saves RMS and other</text><text x="1436" y="851" fill="#5b5f6b" font-size="13.5" font-weight="500">metrics as telemetry.</text><circle cx="1412" cy="938" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="943.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">8</text><text x="1436" y="936" fill="#23262f" font-size="13.5" font-weight="500">A breached rule raises an</text><text x="1436" y="955" fill="#5b5f6b" font-size="13.5" font-weight="500">alarm, stored in ThingsBoard.</text><circle cx="1412" cy="1042" r="15" fill="#23262f" stroke="#fff" stroke-width="2.5"/><text x="1412" y="1047.5" fill="#fff" font-size="15" font-weight="700" text-anchor="middle">9</text><text x="1436" y="1040" fill="#23262f" font-size="13.5" font-weight="500">Dashboards and rule chains</text><text x="1436" y="1059" fill="#5b5f6b" font-size="13.5" font-weight="500">use telemetry and alarms.</text></svg>