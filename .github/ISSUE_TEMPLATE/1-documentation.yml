name: "Documentation issue 📄"
description: Wrong, outdated or missing content on thingsboard.io/docs/pe.
labels: [
  "documentation"
]
body:
  - type: markdown
    attributes:
      value: "# Reminder: If reporting a minor correction (e.g. typo), feel free to submit a PR directly!"
  - type: input
    id: subject
    attributes:
      label: 📚 Subject area/topic
      description: Documentation area/topic (e.g. MQTT API, Rule Engine, Edge installation)
      placeholder: "..."
    validations:
      required: true
  - type: textarea
    id: page
    attributes:
      label: "📋 Page(s) affected (or suggested, for new content)"
      description: Please provide the URL of the page(s) affected.
      placeholder: https://thingsboard.io/docs/pe/getting-started/
    validations:
        required: true
  - type: textarea
    id: generalDesc
    attributes:
      label: "📋 Description of content that is out-of-date or incorrect"
      description: Let us know what's wrong!
      placeholder: "..."
    validations:
        required: true
  - type: textarea
    id: suggestedCorrection
    attributes:
      label: "✅ Suggested correction"
      description: What the correct text or code sample should be, if you know it.
      placeholder: "..."
    validations:
        required: false
