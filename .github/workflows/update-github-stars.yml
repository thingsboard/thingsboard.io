name: Update GitHub stars

on:
  schedule:
    # 06:00 UTC, Monday to Friday.
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: Refresh the star counts pages show
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Tools & Dependencies
        uses: ./.github/actions/install

      - name: Update star counts
        run: pnpm update:stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Opens a PR only when the file changed; later runs update the same branch.
      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/update-github-stars
          base: main
          commit-message: "Update GitHub star counts"
          title: "Update GitHub star counts"
          body: "Automated refresh of `src/data/github-stars.json` by the Update GitHub stars workflow."
          delete-branch: true
